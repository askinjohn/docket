[package]
name = "local-mail"
version = "0.1.0"
description = "Local Mail — local-first Gmail client"
authors = ["Local Mail"]
edition = "2021"

[lib]
name = "local_mail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
